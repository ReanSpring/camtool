version: '3.8'

services:
  server:
    build: ./server
    container_name: camtool-server
    environment:
      - PORT=5001
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/output:/app/output
    restart: always

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=/api
    container_name: camtool-client
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "3000:80"
      - "3443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - server
    restart: always

  certbot:
    image: certbot/certbot
    container_name: camtool-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
